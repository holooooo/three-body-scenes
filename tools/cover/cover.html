<!doctype html>
<meta charset="utf-8">
<title>cover</title>
<style>
  html, body { margin: 0; background: #000; }
  #c { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: "PingFang SC", "Heiti SC", "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #bg { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(.9) saturate(1.2) contrast(1.06); transform: scale(1.04); }
  #scrim { position: absolute; inset: 0; background:
      radial-gradient(ellipse 58% 46% at 50% 52%, rgba(0,0,0,.5), rgba(0,0,0,.14) 72%, rgba(0,0,0,0) 100%),
      linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0) 22%, rgba(0,0,0,0) 78%, rgba(0,0,0,.3)); }
  #grain { position: absolute; inset: 0; box-shadow: inset 0 0 200px rgba(0,0,0,.42); }
  /* all text sits in the middle band: the bottom corners belong to the platform's UI */
  #stack { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-52%); text-align: center; }
  #model { font-family: "SF Pro Display", "Helvetica Neue", "Arial Black", Arial, sans-serif; font-weight: 900; font-size: 292px; line-height: 1; letter-spacing: -.035em; white-space: nowrap;
    filter: drop-shadow(0 10px 34px rgba(0,0,0,.7)) drop-shadow(0 0 60px var(--glow)); }
  #model .a { background: linear-gradient(180deg, #ffffff 10%, #dfe6f2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #model .b { margin-left: .08em; background: linear-gradient(180deg, var(--c1) 8%, var(--c2) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #line2 { margin-top: 6px; font-weight: 900; font-size: 154px; line-height: 1.12; letter-spacing: .02em; white-space: nowrap;
    -webkit-text-stroke: 2px rgba(0,0,0,.35); paint-order: stroke fill; text-shadow: 0 6px 30px rgba(0,0,0,.75), 0 0 3px rgba(0,0,0,.6); }
  #line2 em { font-style: normal; color: var(--c1); }
  #pill { display: inline-flex; align-items: center; gap: 22px; margin-top: 36px; padding: 12px 46px 14px 14px; border-radius: 999px; background: rgba(8,10,16,.62); border: 3px solid var(--c1); box-shadow: 0 0 40px var(--glow), 0 8px 30px rgba(0,0,0,.5); font-weight: 800; font-size: 64px; letter-spacing: .1em; }
  #pill b { display: inline-block; padding: 2px 26px 4px; border-radius: 999px; background: linear-gradient(90deg, var(--c1), var(--c2)); color: #10121a; font-size: 60px; letter-spacing: .04em; }
  #badge { position: absolute; left: 54px; top: 46px; display: flex; align-items: center; gap: 16px; }
  #badge img { width: 64px; height: 64px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 2px 16px rgba(0,0,0,.6); }
  #badge span { font-size: 30px; font-weight: 600; letter-spacing: .06em; text-shadow: 0 1px 12px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6); }
</style>
<div id="c">
  <div id="bg"></div><div id="scrim"></div><div id="grain"></div>
  <div id="badge"><img src="/brand/avatar.png" alt=""><span>粑粑柑（梭哈ai版）</span></div>
  <div id="stack">
    <div id="model"><span class="a">Fable</span><span class="b">5.2</span></div>
    <div id="line2">复刻了<em>三体名场面</em></div>
    <div id="pill"><b id="no"></b><span id="ep"></span></div>
  </div>
</div>
<script>
  const EP = {
    guzheng: { no: '01', zh: '古筝行动', bg: '/build/stills/guzheng-poster-t002.6.jpg', c1: '#ffd98a', c2: '#ff8a3d', glow: 'rgba(255,150,60,.55)' },
    droplet: { no: '02', zh: '末日战役', bg: '/build/stills/droplet-poster-t024.9.jpg', c1: '#aee6ff', c2: '#4aa6ff', glow: 'rgba(80,170,255,.6)' },
    foil:    { no: '03', zh: '二向箔',   bg: '/build/stills/foil-poster-t000.0.jpg',    c1: '#fff1c4', c2: '#ffb347', glow: 'rgba(255,190,90,.55)' },
  };
  const q = new URLSearchParams(location.search), e = EP[q.get('ep') || 'guzheng'], root = document.getElementById('c');
  for (const k of ['c1', 'c2', 'glow']) root.style.setProperty('--' + k, e[k]);
  document.getElementById('bg').style.backgroundImage = `url(${q.get('bg') || e.bg})`;
  document.getElementById('no').textContent = e.no; document.getElementById('ep').textContent = e.zh;
  const img = new Image(); img.src = q.get('bg') || e.bg;
  Promise.all([document.fonts.ready, img.decode().catch(() => {}), new Promise(r => document.getElementById('badge').querySelector('img').complete ? r() : document.getElementById('badge').querySelector('img').addEventListener('load', r))]).then(() => { window.READY = true; });
</script>
