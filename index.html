<script>
  let lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('tbs-lang') || ((navigator.language || 'zh').toLowerCase().startsWith('zh') ? 'zh' : 'en');
  const apply = () => {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-zh]').forEach(e => { e.textContent = lang === 'zh' ? e.dataset.zh : e.dataset.en; });
    document.getElementById('lang').textContent = lang === 'zh' ? 'EN' : '中';
    document.body.classList.toggle('en', lang !== 'zh');
  };
  document.getElementById('lang').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; localStorage.setItem('tbs-lang', lang); apply(); };
  apply();
  window.READY = true; window.renderFrame = async () => {};
</script>
